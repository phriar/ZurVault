# Config for Cloudflare's Git-connected Worker deploys — added 2026-08-26
# so a push to `main` can auto-deploy me-proxy-worker.js instead of the
# manual copy-paste-into-the-dashboard step this repo used until now.
#
# `name` MUST match the existing Worker's name exactly (the one behind
# zurvault-proxy.stholt.workers.dev) or Cloudflare will create a brand
# new, separate Worker instead of updating the live one. Double-check
# this against Workers & Pages → the Worker → Settings → the name shown
# at the top — if it's not literally "zurvault-proxy", change the line
# below to match before this takes effect.
name = "zurvault-proxy"
main = "me-proxy-worker.js"
compatibility_date = "2026-08-26"

# KV binding, Cron Triggers, and the ANTHROPIC_API_KEY/other secrets are
# NOT set here — those already exist on the live Worker (set up by hand
# in the dashboard per this repo's Configuration docs) and Git-connected
# deploys don't touch bindings/secrets/triggers on their own. This file
# only controls which code gets deployed.
