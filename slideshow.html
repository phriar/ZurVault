<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<title>Slideshow — ZurVault</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --ink:    #0a0a0a;
  --gold:   #8f6fe8;
  --deep:   #6b2fd6;
  --cyan:   #4de8ff;
  --border: rgba(255,255,255,0.07);
}

html, body { width:100%; min-height:100%; background:var(--ink); }
body { font-family:'DM Mono',monospace; }

#grain {
  position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.028;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

main {
  position:relative; z-index:1; min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:24px;
}

.wordmark { font-size:.52rem; letter-spacing:.55em; color:rgba(255,255,255,0.22); text-transform:uppercase; margin-bottom:18px; }
h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(2.2rem,6vw,3.4rem); letter-spacing:.03em; color:rgba(255,255,255,0.92); margin-bottom:16px; }
p { font-size:.7rem; letter-spacing:.06em; line-height:1.9; color:rgba(255,255,255,0.45); max-width:420px; margin-bottom:28px; }
a.back { font-size:.6rem; letter-spacing:.2em; text-transform:uppercase; color:var(--gold); text-decoration:none; border-bottom:1px solid rgba(143,111,232,0.35); padding-bottom:3px; }
a.back:hover { color:var(--cyan); border-color:var(--cyan); }
</style>
</head>
<body>
<script src="site-nav.js" data-active="slideshow"></script>
<div id="grain"></div>
<main>
  <div class="wordmark">ZurVault</div>
  <h1>Coming Back Soon</h1>
  <p>The kiosk slideshow view is offline for rework. In the meantime, browse the collection from the listings page.</p>
  <a class="back" href="index.html">Back to Listings &#8599;</a>
</main>
</body>
</html>
