<style>
  :root{
    --bg:#0a0a0a;
    --bg-panel:#121212;
    --bg-card:#161616;
    --border:#262626;
    --red:#e0263e;
    --red-dim:#7a1420;
    --green:#39ff6a;
    --text:#e8e8e8;
    --text-dim:#8a8a8a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Oswald',sans-serif; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  header{
    padding:20px 16px 14px; border-bottom:1px solid var(--border);
    position:sticky; top:0; background:rgba(10,10,10,0.95); backdrop-filter:blur(6px); z-index:10;
  }
  header .brand{font-size:14px; letter-spacing:2px; color:var(--text-dim); text-transform:uppercase;}
  header .brand a{color:var(--text-dim); text-decoration:none;}
  header h1{margin:4px 0 0; font-size:26px; font-weight:700; letter-spacing:0.5px;
    text-transform:uppercase;}
  header h1 span{color:var(--red);}

  .tabs{display:flex; gap:0; margin-top:16px; border-bottom:1px solid var(--border);}
  .tab{
    flex:1; text-align:center; padding:10px 8px; font-size:13px; letter-spacing:1px;
    text-transform:uppercase; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent;
    font-weight:500;
  }
  .tab.active{color:var(--text); border-bottom-color:var(--red);}

  .controls{
    display:flex; gap:8px; padding:12px 16px; flex-wrap:wrap; border-bottom:1px solid var(--border);
    background:var(--bg-panel);
  }
  select, input[type=text]{
    background:var(--bg-card); border:1px solid var(--border); color:var(--text);
    font-family:'JetBrains Mono',monospace; font-size:12px; padding:8px 10px; border-radius:4px;
  }
  select:focus, input:focus{outline:1px solid var(--red);}

  #status{padding:14px 16px; font-size:12px; color:var(--text-dim);}
  #status.err{color:var(--red);}
  #status .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--green); margin-right:6px;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:10px; padding:12px 16px 40px;
  }
  .card{
    background:var(--bg-card); border:1px solid var(--border); border-radius:6px; overflow:hidden;
    text-decoration:none; color:var(--text); display:flex; flex-direction:column;
  }
  .card img{width:100%; aspect-ratio:2/3; object-fit:cover; background:#1c1c1c; display:block;}
  .card .body{padding:8px 10px 10px;}
  .card .sub{font-size:9px; letter-spacing:1px; text-transform:uppercase; color:var(--red); margin-bottom:3px;}
  .card .name{font-size:12px; line-height:1.3; font-weight:500; margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card .price{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--green); font-weight:700;}
  .card .time{font-family:'JetBrains Mono',monospace; font-size:10px; color:var(--text-dim); margin-top:2px;}

  .empty{padding:40px 16px; text-align:center; color:var(--text-dim); font-size:13px;}
  .empty a{color:var(--red);}

  footer{padding:20px 16px 40px; text-align:center; font-size:11px; color:var(--text-dim);}
  footer a{color:var(--text-dim);}
</style>

  { sub: "Green Lantern 52 428", symbol: "dc3_super_power_packs_series_villains" },
  { sub: "Batman (1940-2011)", symbol: "batman_19402011_655" },
  { sub: "Wonder Woman (1987-2006)", symbol: "wonder_woman_19872006_1" },
];

// Direct calls to Magic Eden get CORS-blocked from the browser — route through
// the proxy Worker instead. Set this to your deployed Worker URL (see
// me-proxy-worker.js for deploy steps), no trailing slash.
const ME_PROXY_BASE = "https://zurvault-proxy.stholt.workers.dev";
const ME_BASE = ME_PROXY_BASE + "/v2";
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

let allListings = [];
let currentTab = "browse";

const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const subFilterEl = document.getElementById('subFilter');
const sortByEl = document.getElementById('sortBy');

function setStatus(msg, isErr){
  statusEl.innerHTML = (isErr ? '' : '<span class="dot"></span>') + msg;
  statusEl.classList.toggle('err', !!isErr);
}

async function fetchCollectionListings(symbol){
  const res = await fetch(`${ME_BASE}/collections/${symbol}/listings?offset=0&limit=100`);
  if(!res.ok) throw new Error(`${symbol}: HTTP ${res.status}`);
  return res.json();
}

async function loadAll(){
  if(DC_COLLECTIONS.some(c => c.symbol.startsWith('REPLACE'))){
    setStatus('Add real Magic Eden collection symbols in DC_COLLECTIONS at the top of this file.', true);
    return;
  }
  setStatus('Fetching listings from Magic Eden…');
  allListings = [];
  let failed = [];

  for(const col of DC_COLLECTIONS){
    if(col.symbol.startsWith('UNRESOLVED')){
      continue; // no confirmed ME symbol for this one yet — skip rather than waste a request
    }
    try{
      const data = await fetchCollectionListings(col.symbol);
      const items = (Array.isArray(data) ? data : []).map(item => ({
        sub: col.sub,
        symbol: col.symbol,
        name: item?.token?.name || 'Untitled',
        image: item?.token?.image || item?.extra?.img || '',
        price: item?.price ?? null,
        mintAddress: item?.tokenMint || item?.token?.mintAddress || '',
        listedAt: item?.updatedAt || null,
        pdpUrl: `https://magiceden.io/item-details/${item?.tokenMint || item?.token?.mintAddress || ''}`,
      }));
      allListings = allListings.concat(items);
    }catch(e){
      failed.push(col.sub);
      console.error(e);
    }
    setStatus(`Fetching listings… ${allListings.length} found so far (${DC_COLLECTIONS.indexOf(col) + 1}/${DC_COLLECTIONS.length} collections checked)`);
    await sleep(350); // stay under Magic Eden's public rate limit across ~190 collections
  }

  // populate sub-collection filter
  subFilterEl.innerHTML = '<option value="">All sub-collections</option>' +
    DC_COLLECTIONS.map(c => `<option value="${c.sub}">${c.sub}</option>`).join('');

  if(allListings.length === 0){
    setStatus(`No listings found${failed.length ? ' (failed: ' + failed.join(', ') + ')' : ''}. If this persists, Magic Eden's API may be blocking direct browser requests (CORS) — a small proxy would fix that.`, true);
  } else {
    setStatus(`${allListings.length} listings loaded across ${DC_COLLECTIONS.length} sub-collection(s)${failed.length ? ' · failed: ' + failed.join(', ') : ''}.`);
  }
  render();
}

function render(){
  const sub = subFilterEl.value;
  const sort = sortByEl.value;

  let items = allListings.filter(i => !sub || i.sub === sub);

  items.sort((a,b) => {
    if(sort === 'price-asc') return (a.price ?? Infinity) - (b.price ?? Infinity);
    if(sort === 'price-desc') return (b.price ?? -Infinity) - (a.price ?? -Infinity);
    if(sort === 'time-desc') return (b.listedAt ?? 0) - (a.listedAt ?? 0);
    return 0;
  });

  if(currentTab === 'recent'){
    items = items.filter(i => i.listedAt).sort((a,b) => (b.listedAt ?? 0) - (a.listedAt ?? 0)).slice(0, 60);
  }

  if(items.length === 0){
    gridEl.innerHTML = `<div class="empty">No listings match this view yet.<br>Try a different sub-collection or check back later.</div>`;
    return;
  }

  gridEl.innerHTML = items.map(i => `
    <a class="card" href="${i.pdpUrl}" target="_blank" rel="noopener">
      <img src="${i.image}" loading="lazy" onerror="this.style.opacity=0.2">
      <div class="body">
        <div class="sub">${i.sub}</div>
        <div class="name">${i.name}</div>
        <div class="price">${i.price !== null ? i.price + ' SOL' : '—'}</div>
        ${i.listedAt ? `<div class="time">${timeAgo(i.listedAt)}</div>` : ''}
      </div>
    </a>
  `).join('');
}

function timeAgo(ts){
  const secs = typeof ts === 'number' ? (ts > 1e12 ? (Date.now()-ts)/1000 : Date.now()/1000 - ts) : (Date.now() - new Date(ts).getTime())/1000;
  if(secs < 60) return 'just now';
  if(secs < 3600) return Math.floor(secs/60) + 'm ago';
  if(secs < 86400) return Math.floor(secs/3600) + 'h ago';
  return Math.floor(secs/86400) + 'd ago';
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentTab = t.dataset.tab;
    render();
  });
});
subFilterEl.addEventListener('change', render);
sortByEl.addEventListener('change', render);

loadAll();
</script>
</body>
</html>
