  :root{

    background:var(--ink); color:#fff; min-height:100vh;
    font-family:'DM Mono',monospace; -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:'Cormorant Garamond',serif; }

  header{
    padding:120px 32px 20px; border-bottom:1px solid var(--border);
    position:relative; z-index:10; overflow:hidden;
    background-image:url('https://arweave.net/uyG3Nvb1UKTtm3q-tdHs4GNYOiEyaSTc7O0zhsc9gIQ');
    background-size:cover; background-position:center 20%;
  }
  header::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.75) 45%, rgba(10,10,10,0.97) 90%);
  }
  header > *{ position:relative; z-index:1; }
  header .brand{ font-size:.55rem; letter-spacing:.4em; color:rgba(255,255,255,0.18); text-transform:uppercase; }
  header .brand a{ color:rgba(255,255,255,0.18); text-decoration:none; }
  header .brand a:hover{ color:var(--gold); }
  header h1{
    font-family:'Cormorant Garamond',serif; font-weight:300; letter-spacing:.02em;
    font-size:clamp(1.8rem,5vw,2.6rem); color:rgba(255,255,255,0.92); margin-top:10px;
  }
  header h1 span{ color:var(--gold); }

  .back-link{
    display:inline-block; margin-top:14px; font-family:'DM Mono',monospace; font-size:.5rem;
    letter-spacing:.2em; text-transform:uppercase; color:rgba(143,111,232,0.6); text-decoration:none;
    border:1px solid rgba(143,111,232,0.2); padding:6px 14px; border-radius:2px; transition:all .15s;
  }
  .back-link:hover{ color:var(--gold); border-color:rgba(143,111,232,0.5); }

  .tabs{ display:flex; gap:0; margin-top:22px; border-bottom:1px solid var(--border); }
  .tab{
    flex:1; text-align:center; padding:12px 8px; font-size:.5rem; letter-spacing:.25em;
    text-transform:uppercase; color:rgba(255,255,255,0.3); cursor:pointer;
    border-bottom:1px solid transparent; transition:color .15s;
  }
  .tab.active{ color:rgba(255,255,255,0.85); border-bottom-color:var(--cyan); }
  .tab:hover{ color:rgba(255,255,255,0.6); }

  .controls{
    display:flex; gap:8px; padding:16px 32px; flex-wrap:wrap; border-bottom:1px solid var(--border);
    background:rgba(255,255,255,0.015);
  }
  select{
    background:rgba(0,0,0,0.5); border:1px solid var(--border); color:rgba(255,255,255,0.7);
    font-family:'DM Mono',monospace; font-size:.5rem; letter-spacing:.1em; text-transform:uppercase;
    padding:9px 12px; border-radius:2px;
  }
  select:focus{ outline:1px solid rgba(143,111,232,0.4); }

  #status{ padding:16px 32px; font-size:.48rem; letter-spacing:.1em; color:rgba(255,255,255,0.28); text-transform:uppercase; }
  #status.err{ color:#e07a5f; }
  #status .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--cyan); margin-right:8px; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:1px; background:var(--border); padding:1px 32px 60px; margin-top:1px;
  }
  .card{
    background:var(--ink); overflow:hidden; text-decoration:none; color:#fff;
    display:flex; flex-direction:column; transition:background .15s;
  }
  .card:hover{ background:rgba(255,255,255,0.03); }
  .card img{ width:100%; aspect-ratio:2/3; object-fit:cover; background:rgba(255,255,255,0.03); display:block; }
  .card .body{ padding:12px 14px 16px; }
  .card .sub{
    font-family:'DM Mono',monospace; font-size:.4rem; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(143,111,232,0.55); margin-bottom:5px;
  }
  .card .name{
    font-family:'Cormorant Garamond',serif; font-weight:400; font-size:1rem; line-height:1.25;
    color:rgba(255,255,255,0.85); margin-bottom:8px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .price{ font-family:'DM Mono',monospace; font-size:.56rem; letter-spacing:.05em; color:rgba(255,255,255,0.7); }
  .card .time{ font-family:'DM Mono',monospace; font-size:.42rem; letter-spacing:.1em; color:rgba(255,255,255,0.22); margin-top:3px; text-transform:uppercase; }

  .empty{ padding:60px 32px; text-align:center; color:rgba(255,255,255,0.25); font-family:'Cormorant Garamond',serif; font-size:1.2rem; font-weight:300; line-height:1.6; }

  footer{ padding:28px 32px 44px; text-align:center; font-size:.42rem; letter-spacing:.12em; color:rgba(255,255,255,0.15); text-transform:uppercase; }
  footer a{ color:rgba(143,111,232,0.5); text-decoration:none; }
  footer a:hover{ color:var(--gold); }
</style>

  { sub: "Abs Green Lantern 3 149", symbol: "UNRESOLVED_EMQVY8" },
  { sub: "Abs Wonder Woman 1 473", symbol: "absolute_wonder_woman_2024_1" },
  { sub: "Abs Martian Manhunter 1 238", symbol: "absolute_martian_manhunter_2025_1" },
  { sub: "Superman (2023)", symbol: "superman_2023_1" },
  { sub: "Legends (1986-1987)", symbol: "legends_19861987_1" },
  { sub: "Green Lantern 52 428", symbol: "dc3_super_power_packs_series_villains" },
  { sub: "Batman (1940-2011)", symbol: "batman_19402011_655" },
  { sub: "Wonder Woman (1987-2006)", symbol: "wonder_woman_19872006_1" },

// Direct calls to Magic Eden get CORS-blocked from the browser — route through
// the proxy Worker instead. Set this to your deployed Worker URL (see
// me-proxy-worker.js for deploy steps), no trailing slash.
const ME_PROXY_BASE = "https://zurvault-proxy.stholt.workers.dev";
const ME_BASE = ME_PROXY_BASE + "/v2";

let allListings = [];
let allSales = [];
let currentView = 'listings';
let isInitialLoading = false;
let checkedSymbols = new Set();

// During the initial progressive load, a sub-collection whose fetch just
// hasn't happened yet looks identical to one that's genuinely empty. Tell
// them apart so the empty state doesn't read as "nothing here."
function isSubStillLoading(sub){
  if(!isInitialLoading || !sub) return false;
  return DC_COLLECTIONS.some(c => c.sub === sub && !c.symbol.startsWith('UNRESOLVED') && !checkedSymbols.has(c.symbol));
}

const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const subFilterEl = document.getElementById('subFilter');
const sortByEl = document.getElementById('sortBy');

function setStatus(msg, isErr){
  statusEl.innerHTML = (isErr ? '' : '<span class="dot"></span>') + msg;
  statusEl.classList.toggle('err', !!isErr);
}

function shortMint(mint){
  return mint && mint.length > 8 ? mint.slice(0, 4) + '…' + mint.slice(-4) : (mint || '');
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// Fetching ~200 collections × 2 endpoints (listings + activities) in
// parallel is enough to occasionally trip the proxy Worker's rate limit
// (HTTP 429). That's transient, not fatal — retry with backoff instead of
// dropping the collection outright.
async function fetchJSON(url, retries = 5){
  for(let attempt = 0; ; attempt++){
    const res = await fetch(url);
    if(res.ok) return res.json();
    if(res.status === 429 && attempt < retries){
      await sleep(800 * Math.pow(2, attempt)); // 800ms, 1.6s, 3.2s, 6.4s, 12.8s — the proxy's rate-limit cooldown can outlast a couple of short retries
      continue;
    }
    throw new Error(`${url}: HTTP ${res.status}`);
  }
}

async function fetchCollectionListings(symbol){
  return fetchJSON(`${ME_BASE}/collections/${symbol}/listings?offset=0&limit=100`);
}

const SALES_WINDOW_SECS = 7 * 24 * 60 * 60; // Recent Sales looks back one week
const ACTIVITIES_MAX_PAGES = 5; // safety cap — a very active collection could otherwise page forever

// The /listings endpoint carries no timestamp for when an item was listed,
// and has no record of completed sales at all — only /activities has both,
// as blockTime on "list" events and "buyNow"/"acceptBid" (completed sale)
// events. One fetch here serves both: a tokenMint → blockTime map so
// listings can show a real "listed at" time, and a list of recent sales.
// A single 100-event page can be as shallow as a few hours for an active
// collection, so page backwards until we've covered the sales window (or
// run out of history / hit the page cap).
async function fetchCollectionActivities(symbol){
  let all = [];
  for(let page = 0; page < ACTIVITIES_MAX_PAGES; page++){
    const batch = await fetchJSON(`${ME_BASE}/collections/${symbol}/activities?offset=${page * 100}&limit=100`);
    if(!Array.isArray(batch) || batch.length === 0) break;
    all = all.concat(batch);
    const oldest = batch[batch.length - 1];
    const oldestAge = Date.now() / 1000 - (oldest?.blockTime || 0);
    if(batch.length < 100 || oldestAge > SALES_WINDOW_SECS) break; // no more history, or already past the window
  }
  return all;
}

function deriveListedTimes(activities){
  const map = new Map();
  for(const a of activities){
    if(a?.type === 'list' && a?.tokenMint && !map.has(a.tokenMint)){
      map.set(a.tokenMint, a.blockTime || null);
    }
  }
  return map;
}

function deriveSales(activities, col){
  const cutoff = Date.now() / 1000 - SALES_WINDOW_SECS;
  const sales = [];
  for(const a of activities){
    if((a?.type === 'buyNow' || a?.type === 'acceptBid') && a?.tokenMint && (a.blockTime || 0) >= cutoff){
      sales.push({
        sub: col.sub,
        symbol: col.symbol,
        image: a.image || '',
        price: a.price ?? null,
        mint: a.tokenMint,
        soldAt: a.blockTime || null,
        pdpUrl: `https://magiceden.io/item-details/${a.tokenMint}`,
      });
    }
  }
  return sales;
}

// Runs `worker` over `items` with at most `concurrency` in flight at once,
// instead of one request at a time — cuts total scan time roughly in
// proportion to the concurrency factor while still capping how hard we
// hit the Magic Eden proxy.
async function runPool(items, worker, concurrency){
  let i = 0;
  const runners = new Array(Math.min(concurrency, items.length)).fill(0).map(async () => {
    while(i < items.length){
      const item = items[i++];
      await worker(item);
    }
  });
  await Promise.all(runners);
}

// Coalesce bursts of near-simultaneous pool completions into a single
// re-render per animation frame, instead of re-rendering the whole grid
// on every individual response.
let renderScheduled = false;
function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(() => { renderScheduled = false; render(); });
}

async function loadAll(isRefresh){
  if(DC_COLLECTIONS.some(c => c.symbol.startsWith('REPLACE'))){
    setStatus('Add real Magic Eden collection symbols in DC_COLLECTIONS at the top of this file.', true);
    return;
  }

  if(!isRefresh){
    // populate sub-collection filter immediately — DC_COLLECTIONS is static,
    // it doesn't need to wait on any network response.
    subFilterEl.innerHTML = '<option value="">All sub-collections</option>' +
      DC_COLLECTIONS.map(c => `<option value="${c.sub}">${c.sub}</option>`).join('');
    isInitialLoading = true;
    checkedSymbols = new Set();
  }

  setStatus(isRefresh ? 'Refreshing…' : 'Fetching listings from Magic Eden…');
  // Collected into local arrays rather than the shared `allListings`/`allSales`
  // so a background refresh doesn't empty the grid out mid-scan — they're
  // swapped in atomically once the whole pool finishes. The initial load
  // still updates the shared arrays progressively below, for a fast first paint.
  const results = [];
  const salesResults = [];
  let failed = [];
  let checked = 0;

  const toFetch = DC_COLLECTIONS.filter(col => !col.symbol.startsWith('UNRESOLVED'));
  // no confirmed ME symbol yet for UNRESOLVED entries — skip rather than waste a request

  await runPool(toFetch, async (col) => {
    try{
      const [data, rawActivities] = await Promise.all([
        fetchCollectionListings(col.symbol),
        fetchCollectionActivities(col.symbol).catch(() => []), // best-effort — a missing timestamp/sale shouldn't drop the listing
      ]);
      const activities = Array.isArray(rawActivities) ? rawActivities : [];
      const listedTimes = deriveListedTimes(activities);
      const items = (Array.isArray(data) ? data : []).map(item => {
        const mint = item?.tokenMint || item?.token?.mintAddress || '';
        return {
          sub: col.sub,
          symbol: col.symbol,
          name: item?.token?.name || 'Untitled',
          image: item?.token?.image || item?.extra?.img || '',
          price: item?.price ?? null,
          mintAddress: mint,
          listedAt: listedTimes.get(mint) || null,
          pdpUrl: `https://magiceden.io/item-details/${mint}`,
        };
      });
      results.push(...items);
      salesResults.push(...deriveSales(activities, col));
      if(!isRefresh){
        allListings = results;
        allSales = salesResults;
        scheduleRender();
      }
    }catch(e){
      failed.push(col.sub);
      console.error(e);
    }
    if(!isRefresh) checkedSymbols.add(col.symbol);
    checked++;
    setStatus(`${isRefresh ? 'Refreshing' : 'Fetching'}… ${results.length} listings, ${salesResults.length} sales so far (${checked}/${toFetch.length} collections checked)`);
  }, 4); // each worker fires 2 requests (listings + activities) at once, so this is ~8 concurrent requests

  allListings = results;
  allSales = salesResults;
  if(!isRefresh) isInitialLoading = false;

  if(allListings.length === 0){
    setStatus(`No listings found${failed.length ? ' (failed: ' + failed.join(', ') + ')' : ''}. If this persists, Magic Eden's API may be blocking direct browser requests (CORS) — a small proxy would fix that.`, true);
  } else {
    const updated = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    setStatus(`${allListings.length} listings, ${allSales.length} recent sales across ${DC_COLLECTIONS.length} sub-collection(s)${failed.length ? ' · failed: ' + failed.join(', ') : ''} · updated ${updated}, auto-refreshes every 5 min.`);
  }
  render();
}

function sortItems(items, sort, timeField){
  return items.slice().sort((a,b) => {
    if(sort === 'price-asc') return (a.price ?? Infinity) - (b.price ?? Infinity);
    if(sort === 'price-desc') return (b.price ?? -Infinity) - (a.price ?? -Infinity);
    if(sort === 'time-desc') return (b[timeField] ?? 0) - (a[timeField] ?? 0);
    return 0;
  });
}

function render(){
  if(currentView === 'sales') renderSales();
  else renderListings();
}

function renderListings(){
  const sub = subFilterEl.value;
  const items = sortItems(allListings.filter(i => !sub || i.sub === sub), sortByEl.value, 'listedAt');

  if(items.length === 0){
    gridEl.innerHTML = isSubStillLoading(sub)
      ? `<div class="empty">Still scanning this sub-collection…<br>Results will appear as soon as it's checked.</div>`
      : `<div class="empty">No listings match this view yet.<br>Try a different sub-collection or check back later.</div>`;
    return;
  }

  gridEl.innerHTML = items.map(i => `
    <a class="card" href="${i.pdpUrl}" target="_blank" rel="noopener">
      <img src="${i.image}" loading="lazy" onerror="this.style.opacity=0.2">
      <div class="body">
        <div class="sub">${i.sub}</div>
        <div class="name">${i.name}</div>
        <div class="price">${i.price !== null ? i.price + ' SOL' : '—'}</div>
        ${i.listedAt ? `<div class="time">${timeAgo(i.listedAt)}</div>` : ''}
      </div>
    </a>
  `).join('');
}

function renderSales(){
  const sub = subFilterEl.value;
  const items = sortItems(allSales.filter(i => !sub || i.sub === sub), sortByEl.value, 'soldAt').slice(0, 200);

  if(items.length === 0){
    gridEl.innerHTML = isSubStillLoading(sub)
      ? `<div class="empty">Still scanning this sub-collection…<br>Results will appear as soon as it's checked.</div>`
      : `<div class="empty">No sales in the last 7 days for this view.<br>Try a different sub-collection or check back later.</div>`;
    return;
  }

  gridEl.innerHTML = items.map(i => `
    <a class="card" href="${i.pdpUrl}" target="_blank" rel="noopener">
      <img src="${i.image}" loading="lazy" onerror="this.style.opacity=0.2">
      <div class="body">
        <div class="sub">${i.sub}</div>
        <div class="name">Sold · ${shortMint(i.mint)}</div>
        <div class="price">${i.price !== null ? i.price + ' SOL' : '—'}</div>
        ${i.soldAt ? `<div class="time">${timeAgo(i.soldAt)}</div>` : ''}
      </div>
    </a>
  `).join('');
}

function timeAgo(ts){
  const secs = typeof ts === 'number' ? (ts > 1e12 ? (Date.now()-ts)/1000 : Date.now()/1000 - ts) : (Date.now() - new Date(ts).getTime())/1000;
  if(secs < 60) return 'just now';
  if(secs < 3600) return Math.floor(secs/60) + 'm ago';
  if(secs < 86400) return Math.floor(secs/3600) + 'h ago';
  return Math.floor(secs/86400) + 'd ago';
}

subFilterEl.addEventListener('change', render);
sortByEl.addEventListener('change', render);

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentView = t.dataset.view;
    render();
  });
});

const REFRESH_INTERVAL = 5 * 60 * 1000; // re-scan every 5 minutes to pick up new listings
loadAll();
setInterval(() => loadAll(true), REFRESH_INTERVAL);
</script>
