<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --ink:    #0a0a0a;
    --gold:   #8f6fe8;
    --deep:   #6b2fd6;
    --cyan:   #4de8ff;
    --faint:  rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.07);
  }

  body{
    background:var(--ink); color:#fff; min-height:100vh;
    font-family:'DM Mono',monospace; -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:'Cormorant Garamond',serif; }

  header{
    padding:120px 32px 20px; border-bottom:1px solid var(--border);
    position:relative; z-index:10; overflow:hidden;
    background-image:url('https://arweave.net/uyG3Nvb1UKTtm3q-tdHs4GNYOiEyaSTc7O0zhsc9gIQ');
    background-size:cover; background-position:center 20%;
  }
  header::before{
    content:''; position:absolute; inset:0;
    background:linear-gradient(to bottom, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.75) 45%, rgba(10,10,10,0.97) 90%);
  }
  header > *{ position:relative; z-index:1; }
  header .brand{ font-size:.94rem; letter-spacing:.18em; color:rgba(255,255,255,0.5); text-transform:uppercase; }
  header .brand a{ color:rgba(255,255,255,0.5); text-decoration:none; }
  header .brand a:hover{ color:var(--gold); }
  header h1{
    font-family:'Cormorant Garamond',serif; font-weight:300; letter-spacing:.02em;
    font-size:clamp(1.8rem,5vw,2.6rem); color:rgba(255,255,255,0.92); margin-top:10px;
  }
  header h1 span{ color:var(--gold); }
  header p.blurb{
    margin-top:14px; max-width:560px; font-family:'Cormorant Garamond',serif; font-size:1.05rem;
    line-height:1.65; color:rgba(255,255,255,0.55);
  }

  .back-link{
    display:inline-block; margin-top:14px; font-family:'DM Mono',monospace; font-size:.94rem;
    letter-spacing:.12em; text-transform:uppercase; color:rgba(143,111,232,0.92); text-decoration:none;
    border:1px solid rgba(143,111,232,0.2); padding:6px 14px; border-radius:2px; transition:all .15s;
  }
  .back-link:hover{ color:var(--gold); border-color:rgba(143,111,232,0.5); }

  .tabs{ display:flex; gap:0; margin-top:22px; border-bottom:1px solid var(--border); }
  .tab{
    flex:1; text-align:center; padding:12px 8px; font-size:.94rem; letter-spacing:.15em;
    text-transform:uppercase; color:rgba(255,255,255,0.55); cursor:pointer;
    border-bottom:1px solid transparent; transition:color .15s;
  }
  .tab.active{ color:rgba(255,255,255,0.85); border-bottom-color:var(--cyan); }
  .tab:hover{ color:rgba(255,255,255,0.6); }

  #status{ padding:16px 32px; font-size:.66rem; letter-spacing:.1em; color:rgba(255,255,255,0.55); text-transform:uppercase; }
  #status.err{ color:#e07a5f; }
  #status .dot{ display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--cyan); margin-right:8px; }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:1px; background:var(--border); padding:1px 32px 60px; margin-top:1px;
  }
  .card{
    background:var(--ink); overflow:hidden; text-decoration:none; color:#fff;
    display:flex; flex-direction:column; transition:background .15s;
  }
  .card:hover{ background:rgba(255,255,255,0.03); }
  .card img{ width:100%; aspect-ratio:2/3; object-fit:cover; background:rgba(255,255,255,0.03); display:block; }
  .card .body{ padding:12px 14px 16px; }

  /* Accessibility pass (WCAG 2.1 AA, computed against #0a0a0a — not
     eyeballed): .sub was 4.09:1 (fail, small text needs 4.5:1) at
     8px/55%, now 4.61:1 at 15px/92%. .time was 4.06:1 (fail) at 8px/42%,
     now 6.28:1 at 15px/55%. .name (14.16:1) and .price (16.01:1) already
     passed; bumped in size only, to 20px/16px respectively.
     Color-blindness: this card has no red/green pairing (the pair that
     actually breaks under deuteranopia/protanopia), and .sub/.name/
     .price/.time are already each distinguished by font-family, case,
     size, and position independent of color — verified with the "remove
     all color, can you still tell them apart" test — so no icon/badge
     was added; typographic hierarchy alone carries the distinction. */
  .card .sub{
    font-family:'DM Mono',monospace; font-size:.94rem; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(143,111,232,0.92); margin-bottom:5px;
  }
  .card .name{
    font-family:'Cormorant Garamond',serif; font-weight:400; font-size:1.25rem; line-height:1.25;
    color:rgba(255,255,255,0.85); margin-bottom:8px;
    display:-webkit-box; -webkit-line-clamp:2; line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card .price{ font-family:'DM Mono',monospace; font-size:1rem; letter-spacing:.05em; color:rgba(255,255,255,0.9); }
  .card .time{ font-family:'DM Mono',monospace; font-size:.94rem; letter-spacing:.1em; color:rgba(255,255,255,0.55); margin-top:3px; text-transform:uppercase; }

  .controls{
    display:flex; gap:8px; padding:16px 32px; flex-wrap:wrap; border-bottom:1px solid var(--border);
    background:rgba(255,255,255,0.015);
  }
  .pill{
    font-family:'DM Mono',monospace; font-size:.68rem; letter-spacing:.12em; text-transform:uppercase;
    color:rgba(255,255,255,0.6); padding:8px 14px; border:1px solid var(--border); border-radius:20px;
    cursor:pointer; transition:all .15s; background:transparent;
  }
  .pill:hover{ color:rgba(255,255,255,0.7); border-color:rgba(143,111,232,0.3); }
  .pill.active{ color:#fff; background:linear-gradient(135deg, var(--deep), var(--gold)); border-color:transparent; }
  .view-toggle{ display:flex; gap:8px; margin-left:auto; }

  /* List view — same data as the card grid, one full-width row per item
     instead of a narrow tile, so the name (and any mint/edition number
     embedded in it) never needs clamping the way a 150px card does. */
  .list{ display:flex; flex-direction:column; gap:1px; background:var(--border); padding:1px 32px 60px; margin-top:1px; }
  .list-row{
    background:var(--ink); display:flex; align-items:center; gap:14px; padding:10px 14px;
    text-decoration:none; color:#fff; transition:background .15s;
  }
  .list-row:hover{ background:rgba(255,255,255,0.03); }
  .list-row img{ width:44px; height:66px; object-fit:cover; border-radius:2px; flex-shrink:0; background:rgba(255,255,255,0.03); }
  .list-row .info{ flex:1; min-width:0; }
  .list-row .sub{
    font-family:'DM Mono',monospace; font-size:.94rem; letter-spacing:.14em; text-transform:uppercase;
    color:rgba(143,111,232,0.92); margin-bottom:3px;
  }
  .list-row .name{ font-family:'Cormorant Garamond',serif; font-size:1.25rem; line-height:1.25; color:rgba(255,255,255,0.85); }
  .list-row .price-col{ flex-shrink:0; text-align:right; }
  .list-row .price{ font-family:'DM Mono',monospace; font-size:1.05rem; color:rgba(255,255,255,0.9); white-space:nowrap; }
  .list-row .mint{ font-family:'DM Mono',monospace; font-size:.94rem; color:rgba(255,255,255,0.5); margin-top:2px; white-space:nowrap; }
  .list-row .time{ font-family:'DM Mono',monospace; font-size:.94rem; color:rgba(255,255,255,0.55); margin-top:2px; text-transform:uppercase; white-space:nowrap; }

  /* Explicit "you're leaving to a third-party marketplace" cue placed
     directly on the price/CTA itself, not just in the page-level banner —
     rgba(77,232,255,0.7) on #0a0a0a computes to ~6.8:1 contrast, clears
     the same WCAG AA bar the rest of this page's small text holds to. */
  .me-tag{ font-family:'DM Mono',monospace; font-size:.62rem; letter-spacing:.05em; text-transform:uppercase; color:rgba(77,232,255,0.7); margin-top:2px; white-space:nowrap; }

  .empty{ padding:60px 32px; text-align:center; color:rgba(255,255,255,0.55); font-family:'Cormorant Garamond',serif; font-size:1.2rem; font-weight:300; line-height:1.6; }

  .section-label{
    padding:28px 32px 12px; font-size:.68rem; letter-spacing:.3em; text-transform:uppercase;
    color:rgba(255,255,255,0.5);
  }
  .history{
    margin:0 32px; max-width:720px; font-family:'Cormorant Garamond',serif; font-size:1rem;
    line-height:1.75; color:rgba(255,255,255,0.6);
  }
  .key-issues{ display:flex; flex-direction:column; gap:1px; background:var(--border); margin:0 32px 8px; border-radius:4px; overflow:hidden; }
  .key-issue-card{
    display:flex; gap:14px; padding:14px 16px; background:var(--ink); text-decoration:none; color:#fff;
    transition:background .15s;
  }
  .key-issue-card:hover{ background:rgba(255,255,255,0.03); }
  .key-issue-card img{
    width:52px; height:78px; object-fit:cover; border-radius:3px; flex-shrink:0; background:var(--faint);
  }
  .key-issue-card .k-name{
    font-family:'Cormorant Garamond',serif; font-size:1.05rem; color:rgba(255,255,255,0.9); margin-bottom:4px;
  }
  .key-issue-card .k-note{
    font-family:'Cormorant Garamond',serif; font-size:.85rem; line-height:1.5; color:rgba(255,255,255,0.5);
  }

  footer{ padding:28px 32px 44px; text-align:center; font-size:.64rem; letter-spacing:.12em; color:rgba(255,255,255,0.5); text-transform:uppercase; }
  footer a{ color:rgba(143,111,232,0.92); text-decoration:none; }
  footer a:hover{ color:var(--gold); }
</style>
</head>
<body>
<script src="site-nav.js" data-active="collections"></script>
<script src="collections-map.js"></script>
<script src="character-map.js"></script>
<div id="grain" style="position:fixed;inset:0;z-index:200;pointer-events:none;opacity:0.025;background-image:url(&quot;data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E&quot;);"></div>

<header>
  <div class="brand"><a href="collections.html" id="collCrumbHome">ZurVault</a> / <span id="collCrumbType">Collections</span> / <span id="collNameCrumb">…</span></div>
  <h1 id="collTitle">Loading&hellip;</h1>
  <p class="blurb" id="collBlurb"></p>
  <a class="back-link" id="collBackLink" href="collections.html">&#8592; All Series</a>
  <div class="tabs">
    <div class="tab active" data-view="listings">For Sale</div>
    <div class="tab" data-view="sales">Recently Sold</div>
  </div>
</header>

<div id="historySlot"></div>
<div id="keyIssuesSlot"></div>

<div class="controls">
  <div class="view-toggle" id="viewToggle">
    <button class="pill active" data-view="grid">Grid</button>
    <button class="pill" data-view="list">List</button>
  </div>
</div>

<div id="status"><span class="dot"></span>Loading&hellip;</div>
<div id="grid" class="grid"></div>

<footer>
  Live listing data via Magic Eden public API · <a href="index.html">zurvault.com</a>
</footer>

<script>
const ME_PROXY_BASE = "https://zurvault-proxy.stholt.workers.dev";
const ME_BASE = ME_PROXY_BASE + "/v2";

const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const collTitleEl = document.getElementById('collTitle');
const collBlurbEl = document.getElementById('collBlurb');
const collNameCrumbEl = document.getElementById('collNameCrumb');
const historySlot = document.getElementById('historySlot');
const keyIssuesSlot = document.getElementById('keyIssuesSlot');
const viewToggleEl = document.getElementById('viewToggle');

let allListings = [];
let allSales = [];
let currentView = 'listings';
let currentDisplay = 'grid';
let currentKind = 'series';

function setStatus(msg, isErr){
  statusEl.innerHTML = (isErr ? '' : '<span class="dot"></span>') + msg;
  statusEl.classList.toggle('err', !!isErr);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

// Magic Eden listing names for these collections commonly end in
// "(edition/total)", e.g. "Flashpoint (2011) #1 (501/1314)" — pull that
// out to show as a mint/edition badge in list view, where there's room for
// it. Falls back to nothing if the name doesn't match that pattern.
function parseEdition(name){
  const m = /\((\d+)\s*\/\s*(\d+)\)\s*$/.exec(name || '');
  return m ? `#${m[1]} / ${m[2]}` : null;
}

function timeAgo(ts){
  const secs = typeof ts === 'number' ? (ts > 1e12 ? (Date.now()-ts)/1000 : Date.now()/1000 - ts) : (Date.now() - new Date(ts).getTime())/1000;
  if(secs < 60) return 'just now';
  if(secs < 3600) return Math.floor(secs/60) + 'm ago';
  if(secs < 86400) return Math.floor(secs/3600) + 'h ago';
  return Math.floor(secs/86400) + 'd ago';
}

function shortMint(mint){
  return mint && mint.length > 8 ? mint.slice(0, 4) + '…' + mint.slice(-4) : (mint || '');
}

// Falls back to the mint address if buyer isn't present yet (older cached
// KV entries written before the Worker started capturing it) — never shows
// a blank label.
function soldLabel(i){
  return i.buyer ? `Sold to ${shortMint(i.buyer)}` : `Sold · ${shortMint(i.mint)}`;
}

function renderHistory(collection){
  if(!collection.history){ historySlot.innerHTML = ''; return; }
  historySlot.innerHTML = `
    <div class="section-label">History</div>
    <p class="history">${esc(collection.history)}</p>
  `;
}

// Curated "key issues" for this series (collections-map.js). Same pattern
// as CHARACTER_MAP's `highlights` (rendered here too, for `?c=` characters):
// each entry is just a symbol + a note — pull the image/name from whatever live data we already
// have for it (currently for sale, or sold in the last 7 days), and fall
// back to a plain text card linking to Magic Eden if neither is available.
function renderKeyIssues(collection){
  const keyIssues = collection.keyIssues || [];
  if(keyIssues.length === 0){ keyIssuesSlot.innerHTML = ''; return; }
  const label = collection.kind === 'character' ? 'Essential Reading' : 'Key Issues';

  const cards = keyIssues.map(k => {
    const match = allListings.find(i => i.symbol === k.symbol) || allSales.find(i => i.symbol === k.symbol);
    const image = match ? match.image : '';
    const name = match ? match.name : null;
    const href = match ? match.pdpUrl : `https://magiceden.io/marketplace/${encodeURIComponent(k.symbol)}`;
    return `
      <a class="key-issue-card" href="${href}" target="_blank" rel="noopener" data-track="me" data-track-context="${esc(k.symbol)}" data-track-mint="${esc(match ? (match.mintAddress || match.mint || "") : "")}">
        <img src="${image}" loading="lazy" onerror="this.style.opacity=0.15">
        <div>
          ${name ? `<div class="k-name">${esc(name)}</div>` : ''}
          <div class="k-note">${esc(k.note)}</div>
        </div>
      </a>
    `;
  }).join('');

  keyIssuesSlot.innerHTML = `
    <div class="section-label">${label}</div>
    <div class="key-issues">${cards}</div>
  `;
}

function render(){
  if(currentView === 'sales') renderSales();
  else renderListings();
}

function renderListings(){
  const items = allListings.slice().sort((a,b) => (b.listedAt ?? 0) - (a.listedAt ?? 0));
  if(items.length === 0){
    gridEl.className = currentDisplay;
    const noun = currentKind === 'character' ? "this character's tracked collections" : 'this series';
    gridEl.innerHTML = `<div class="empty">Nothing currently for sale in ${noun}.<br>Check back later, or browse <a href="index.html" style="color:var(--gold)">all DC listings</a>.</div>`;
    return;
  }

  if(currentDisplay === 'list'){
    gridEl.className = 'list';
    gridEl.innerHTML = items.map(i => `
      <a class="list-row" href="${esc(i.pdpUrl)}" target="_blank" rel="noopener" data-track="me" data-track-context="${esc(i.symbol)}" data-track-mint="${esc(i.mintAddress)}">
        <img ${i.image ? `src="${esc(i.image)}"` : ''} loading="lazy" onerror="this.style.opacity=0.2">
        <div class="info">
          <div class="sub">${esc(i.sub)}</div>
          <div class="name">${esc(i.name)}</div>
        </div>
        <div class="price-col">
          <div class="price">${i.price !== null ? i.price + ' SOL' : '—'}</div>
          <div class="me-tag">Magic Eden &#8599;</div>
          ${parseEdition(i.name) ? `<div class="mint">${parseEdition(i.name)}</div>` : ''}
          ${i.listedAt ? `<div class="time">${timeAgo(i.listedAt)}</div>` : ''}
        </div>
      </a>
    `).join('');
    return;
  }

  gridEl.className = 'grid';
  gridEl.innerHTML = items.map(i => `
    <a class="card" href="${esc(i.pdpUrl)}" target="_blank" rel="noopener" data-track="me" data-track-context="${esc(i.symbol)}" data-track-mint="${esc(i.mintAddress)}">
      <img ${i.image ? `src="${esc(i.image)}"` : ''} loading="lazy" onerror="this.style.opacity=0.2">
      <div class="body">
        <div class="sub">${esc(i.sub)}</div>
        <div class="name">${esc(i.name)}</div>
        <div class="price">${i.price !== null ? i.price + ' SOL' : '—'}</div>
        <div class="me-tag">Magic Eden &#8599;</div>
        ${i.listedAt ? `<div class="time">${timeAgo(i.listedAt)}</div>` : ''}
      </div>
    </a>
  `).join('');
}

function renderSales(){
  const items = allSales.slice().sort((a,b) => (b.soldAt ?? 0) - (a.soldAt ?? 0)).slice(0, 200);
  if(items.length === 0){
    gridEl.className = currentDisplay;
    const noun = currentKind === 'character' ? 'this character' : 'this series';
    gridEl.innerHTML = `<div class="empty">No sales in the last 7 days for ${noun}.<br>Check back later, or browse <a href="index.html" style="color:var(--gold)">all DC listings</a>.</div>`;
    return;
  }

  if(currentDisplay === 'list'){
    gridEl.className = 'list';
    gridEl.innerHTML = items.map(i => `
      <a class="list-row" href="${esc(i.pdpUrl)}" target="_blank" rel="noopener" data-track="me" data-track-context="${esc(i.symbol)}" data-track-mint="${esc(i.mint)}">
        <img ${i.image ? `src="${esc(i.image)}"` : ''} loading="lazy" onerror="this.style.opacity=0.2">
        <div class="info">
          <div class="sub">${esc(i.sub)}</div>
          <div class="name">${soldLabel(i)}</div>
        </div>
        <div class="price-col">
          <div class="price">${i.price !== null ? i.price + ' SOL' : '—'}</div>
          <div class="me-tag">Magic Eden &#8599;</div>
          ${i.soldAt ? `<div class="time">${timeAgo(i.soldAt)}</div>` : ''}
        </div>
      </a>
    `).join('');
    return;
  }

  gridEl.className = 'grid';
  gridEl.innerHTML = items.map(i => `
    <a class="card" href="${esc(i.pdpUrl)}" target="_blank" rel="noopener" data-track="me" data-track-context="${esc(i.symbol)}" data-track-mint="${esc(i.mint)}">
      <img ${i.image ? `src="${esc(i.image)}"` : ''} loading="lazy" onerror="this.style.opacity=0.2">
      <div class="body">
        <div class="sub">${esc(i.sub)}</div>
        <div class="name">${soldLabel(i)}</div>
        <div class="price">${i.price !== null ? i.price + ' SOL' : '—'}</div>
        <div class="me-tag">Magic Eden &#8599;</div>
        ${i.soldAt ? `<div class="time">${timeAgo(i.soldAt)}</div>` : ''}
      </div>
    </a>
  `).join('');
}

async function loadCollection(){
  const params = new URLSearchParams(window.location.search);
  const sId = params.get('s');
  const cId = !sId ? params.get('c') : null;
  const kind = sId ? 'series' : (cId ? 'character' : null);
  const raw = kind === 'series' ? COLLECTIONS_MAP[sId] : (kind === 'character' ? CHARACTER_MAP[cId] : undefined);

  const crumbTypeEl = document.getElementById('collCrumbType');
  const crumbHomeEl = document.getElementById('collCrumbHome');
  const backLinkEl = document.getElementById('collBackLink');

  if(!raw){
    collTitleEl.textContent = 'Not found';
    collNameCrumbEl.textContent = '?';
    setStatus(`No series or character matches "${esc(sId || cId || '')}". Go back and pick one from the list.`, true);
    gridEl.innerHTML = `<div class="empty">Unknown series or character.<br><a href="collections.html" style="color:var(--gold)">&#8592; Back to all collections</a></div>`;
    return;
  }

  currentKind = kind;
  const collection = {
    name: raw.name,
    blurb: raw.blurb,
    history: raw.history,
    keyIssues: raw.keyIssues || raw.highlights || [],
    symbols: raw.symbols,
    kind,
  };

  if(kind === 'character'){
    crumbTypeEl.textContent = 'Characters';
    crumbHomeEl.href = 'collections.html?tab=characters';
    backLinkEl.textContent = '← All Characters';
    backLinkEl.href = 'collections.html?tab=characters';
  }else{
    crumbTypeEl.textContent = 'Collections';
    crumbHomeEl.href = 'collections.html';
    backLinkEl.textContent = '← All Series';
    backLinkEl.href = 'collections.html';
  }

  document.title = `${collection.name} — ZurVault`;
  const collDesc = collection.blurb || `Live Magic Eden listings and sales for ${collection.name}, a DC Comics NFT collection on Solana.`;
  document.querySelector('meta[name="description"]').setAttribute('content', collDesc);
  document.querySelector('meta[property="og:title"]').setAttribute('content', `${collection.name} — ZurVault`);
  document.querySelector('meta[property="og:description"]').setAttribute('content', collDesc);
  document.querySelector('meta[name="twitter:title"]').setAttribute('content', `${collection.name} — ZurVault`);
  document.querySelector('meta[name="twitter:description"]').setAttribute('content', collDesc);
  collTitleEl.innerHTML = `${esc(collection.name)}`;
  collNameCrumbEl.textContent = collection.name;
  if(collection.blurb) collBlurbEl.textContent = collection.blurb;
  renderHistory(collection);

  setStatus('Loading…');
  try{
    const res = await fetch(`${ME_BASE}/dc-summary`);
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    if(data.notReady){
      setStatus('The listings service is still setting up — check back in a few minutes.', true);
      return;
    }

    const symbolSet = new Set(collection.symbols);
    allListings = (data.listings || []).filter(i => symbolSet.has(i.symbol));
    allSales = (data.sales || []).filter(i => symbolSet.has(i.symbol));
    renderKeyIssues(collection);

    const updated = data.updatedAt ? new Date(data.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
    const noun = kind === 'character' ? 'tracked collection(s)' : 'tracked issue(s)';
    setStatus(`${allListings.length} for sale, ${allSales.length} sold in the last 7 days across ${collection.symbols.length} ${noun} · updated ${updated}.`);
  }catch(e){
    console.error(e);
    setStatus('Could not reach the listings service. Try reloading in a moment.', true);
    return;
  }
  render();
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentView = t.dataset.view;
    render();
  });
});

viewToggleEl.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    viewToggleEl.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    currentDisplay = p.dataset.view;
    render();
  });
});

loadCollection();
</script>
</body>
</html>
