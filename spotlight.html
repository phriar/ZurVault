<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<title>Spotlight — ZurVault</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root{
    --ink:    #0a0a0a;
    --gold:   #8f6fe8;
    --deep:   #6b2fd6;
    --cyan:   #4de8ff;
    --faint:  rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.07);
  }

  body{
    background:var(--ink); color:#fff; min-height:100vh;
    font-family:'DM Mono',monospace; -webkit-font-smoothing:antialiased;
  }

  .wrap{ max-width:640px; margin:0 auto; padding:96px 24px 60px; }

  .back-link{
    display:inline-block; margin-bottom:24px; font-family:'DM Mono',monospace; font-size:.94rem;
    letter-spacing:.12em; text-transform:uppercase; color:rgba(143,111,232,0.6); text-decoration:none;
    border:1px solid rgba(143,111,232,0.2); padding:6px 14px; border-radius:2px; transition:all .15s;
  }
  .back-link:hover{ color:var(--gold); border-color:rgba(143,111,232,0.5); }

  .eyebrow{ font-size:.48rem; letter-spacing:.3em; text-transform:uppercase; color:var(--cyan); margin-bottom:12px; }
  h1{
    font-family:'Cormorant Garamond',serif; font-weight:300; letter-spacing:.01em;
    font-size:clamp(1.8rem,5vw,2.8rem); line-height:1.15; color:rgba(255,255,255,0.94); margin-bottom:10px;
  }
  .byline{ font-size:.5rem; letter-spacing:.1em; text-transform:uppercase; color:rgba(255,255,255,0.3); margin-bottom:28px; }
  .byline .char-link{ color:rgba(143,111,232,0.7); text-decoration:none; }
  .byline .char-link:hover{ color:var(--gold); }

  .hero{ width:100%; border-radius:4px; margin-bottom:28px; background:var(--faint); display:block; }

  .body{ font-family:'Cormorant Garamond',serif; font-size:1.15rem; line-height:1.75; color:rgba(255,255,255,0.82); }
  .body p{ margin-bottom:18px; }
  .body h2{
    font-family:'DM Mono',monospace; font-size:.5rem; letter-spacing:.25em; text-transform:uppercase;
    color:var(--cyan); margin:32px 0 14px;
  }
  .body h2:first-child{ margin-top:0; }
  .body ul{ margin:0 0 18px; padding-left:1.3em; }
  .body li{ margin-bottom:8px; }

  .char-chips{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; list-style:none; padding:0; }
  .char-chips li{ margin:0; }
  .char-chip{
    display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:20px;
    border:1px solid rgba(143,111,232,0.25); font-family:'DM Mono',monospace; font-size:.55rem;
    letter-spacing:.05em; color:rgba(255,255,255,0.75); text-decoration:none;
  }
  a.char-chip:hover{ border-color:rgba(143,111,232,0.5); color:var(--gold); }

  .author-box{
    margin-top:32px; padding:20px; border-radius:4px; border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.02);
  }
  .author-box .a-name{ font-family:'DM Mono',monospace; font-size:.6rem; letter-spacing:.1em; color:rgba(255,255,255,0.85); margin-bottom:4px; }
  .author-box .a-cowl{ font-family:'DM Mono',monospace; font-size:.46rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(143,111,232,0.6); margin-bottom:10px; }
  .author-box .a-bio{ font-family:'Cormorant Garamond',serif; font-size:.95rem; line-height:1.6; color:rgba(255,255,255,0.55); }

  .cta{
    margin-top:36px; padding:18px 20px; border:1px solid rgba(143,111,232,0.25); border-radius:4px;
    background:rgba(143,111,232,0.05); display:flex; justify-content:space-between; align-items:center;
    gap:12px; flex-wrap:wrap;
  }
  .cta-text{ font-family:'DM Mono',monospace; font-size:.5rem; letter-spacing:.08em; color:rgba(255,255,255,0.5); text-transform:uppercase; }
  .cta-btn{
    font-family:'DM Mono',monospace; font-size:.52rem; letter-spacing:.18em; text-transform:uppercase;
    color:#fff; background:linear-gradient(135deg, var(--deep), var(--gold)); padding:10px 18px;
    border-radius:3px; text-decoration:none; white-space:nowrap;
  }

  .empty{ padding:80px 24px; text-align:center; color:rgba(255,255,255,0.3); font-family:'Cormorant Garamond',serif; font-size:1.3rem; }
  .empty a{ color:var(--gold); }

  footer{ padding:28px 32px 44px; text-align:center; font-size:.42rem; letter-spacing:.12em; color:rgba(255,255,255,0.15); text-transform:uppercase; }
  footer a{ color:rgba(143,111,232,0.5); text-decoration:none; }
  footer a:hover{ color:var(--gold); }
</style>
</head>
<body>
<script src="site-nav.js" data-active="spotlight"></script>
<script src="character-map.js"></script>
<script src="spotlights-data.js"></script>

<div class="wrap" id="content">
  <a class="back-link" href="characters.html">&#8592; All Characters</a>
  <div class="empty" id="loading">Loading&hellip;</div>
</div>

<footer>
  A ZurVault companion to <a href="https://candy.io" target="_blank" rel="noopener">candy.io</a> · <a href="index.html">zurvault.com</a>
</footer>

<script>
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

const params = new URLSearchParams(window.location.search);
const id = params.get('id') || '';
const entry = (typeof SPOTLIGHTS !== 'undefined' ? SPOTLIGHTS : []).find(s => s.id === id);
const loadingEl = document.getElementById('loading');
const contentEl = document.getElementById('content');

if(!entry){
  loadingEl.innerHTML = `No spotlight matches "${esc(id)}".<br><a href="characters.html">&#8592; Back to Characters</a>`;
}else{
  document.title = `${entry.title} — ZurVault`;
  const character = entry.characterId ? CHARACTER_MAP[entry.characterId] : null;

  let ctaHtml = '';
  if(character){
    ctaHtml = `
      <div class="cta">
        <div class="cta-text">See what's for sale &amp; sold</div>
        <a class="cta-btn" href="character.html?c=${encodeURIComponent(entry.characterId)}">${esc(character.name)} Listings &#8599;</a>
      </div>`;
  }else if(entry.collectionSymbol){
    ctaHtml = `
      <div class="cta">
        <div class="cta-text">View this collection</div>
        <a class="cta-btn" href="https://magiceden.io/marketplace/${encodeURIComponent(entry.collectionSymbol)}" target="_blank" rel="noopener" data-track="me" data-track-context="${esc(entry.collectionSymbol)}">Magic Eden &#8599;</a>
      </div>`;
  }

  const bylineParts = [];
  if(entry.author) bylineParts.push(esc(entry.author));
  if(entry.publishedAt) bylineParts.push(esc(entry.publishedAt));
  if(character) bylineParts.push(`<a class="char-link" href="character.html?c=${encodeURIComponent(entry.characterId)}">${esc(character.name)}</a>`);

  loadingEl.outerHTML = `
    <div class="eyebrow">Spotlight</div>
    <h1>${esc(entry.title)}</h1>
    <div class="byline">${bylineParts.join(' · ')}</div>
    ${entry.heroImage ? `<img class="hero" src="${entry.heroImage}" onerror="this.style.display='none'">` : ''}
    <div class="body">${entry.body || ''}</div>
    ${ctaHtml}
  `;
}
</script>
</body>
</html>
